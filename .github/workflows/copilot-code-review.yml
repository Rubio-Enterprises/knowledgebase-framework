name: Copilot Code Review

"on": workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest # Copilot review must not inherit the org's private runner
    timeout-minutes: 59
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
