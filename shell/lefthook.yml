# The Knowledgebase Framework's Hooks, fetched from the framework's v2 branch, refreshed every 24
# hours. Lefthook reads `remotes` only from this file, not from an extended one; the standards
# `knowledgebase hooks` Check requires them here and fetched.
remotes:
  - git_url: https://github.com/Rubio-Enterprises/knowledgebase-framework.git
    ref: v2
    refetch_frequency: 24h
    configs:
      - hooks/knowledgebase.yml
